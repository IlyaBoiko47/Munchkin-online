<!DOCTYPE html>
<html lang="ru" class="site-ui-scale">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Начать игру</title>
	<link rel="stylesheet" href="/css/reset.css">
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="/css/site-pages.css">
</head>
<body>
	<header class="header">
		<div class="wrapper">
			<div class="header_wrapper">
				<div class="header__logo">
					<a href="/" class="header__logo-link">
						<img src="/img/svg/Лого2 1.svg" width="880" height="240" alt="Манчкин" class="header__logo-pic">
					</a>
				</div>
			</div>
		</div>
	</header>
	<main class="main">
		<section class="menu">
			<div class="wrapper">
				<ul class="start_game__list">
					<nav class="start_game__nav">
						<li class="header__item">
							<a href="/lobby" class="header__link">Присоединиться <br> к комнате</a>
						</li>
						<a href="/lobby" class="header__logo-link">
							<img src="/img/svg/Connect.png" alt="Присоединиться" class="start_game__logo-pic start_game__logo-pic--connect">
						</a>
					</nav>
					<nav class="start_game__nav">
						<li class="header__item">
							<a href="/lobby?create=1" class="header__link">Создать <br> комнату</a>
						</li>
						<a href="/lobby?create=1" class="header__logo-link">
							<img src="/img/svg/Create_room.png" alt="Создать комнату" class="start_game__logo-pic start_game__logo-pic--create">
						</a>
					</nav>
				</ul>
			</div>
			<div class="settings">
				<a href="/menu_settings.html" class="settings__logo-link">
					<img src="/img/svg/settings.svg" width="115" height="115" alt="Настройки" class="settings__logo-pic">
				</a>
			</div>
			<div class="back_buttom">
				<a href="/" class="back__logo-link">
					<img src="/img/svg/back.svg" width="150" height="115" alt="Назад" class="back__logo-pic">
				</a>
			</div>
		</section>
	</main>
</body>
</html>
