<!DOCTYPE html>
<html lang="ru" class="site-ui-scale">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Колоды карт</title>
	<link rel="stylesheet" href="/css/reset.css">
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="/css/site-pages.css">
</head>
<body>
	<header class="header">
		<div class="wrapper">
			<div class="header_wrapper">
				<div class="header__logo">
					<a href="/" class="header__logo-link">
						<img src="/img/svg/Лого2 1.svg" width="880" height="240" alt="Манчкин" class="header__logo-pic">
					</a>
				</div>
			</div>
		</div>
	</header>
	<main class="main">
		<section class="menu">
			<div class="wrapper__pack">
				<ul class="pack__list">
					<a href="/1pack.html" class="pack-link">
						<img src="/img/svg/1часть%20(1).png" alt="1 колода" class="pack__logo-pic">
					</a>
					<span class="pack-link pack-link--static">
						<img src="/img/svg/2часть.png" alt="2 колода" class="pack__logo-pic">
					</span>
					<span class="pack-link pack-link--static">
						<img src="/img/svg/3часть.png" alt="3 колода" class="pack__logo-pic">
					</span>
					<span class="pack-link pack-link--static">
						<img src="/img/svg/4часть.png" alt="4 колода" class="pack__logo-pic">
					</span>
					<span class="pack-link pack-link--static">
						<img src="/img/svg/5часть.png" alt="5 колода" class="pack__logo-pic">
					</span>
					<span class="pack-link pack-link--static">
						<img src="/img/svg/6часть.png" alt="6 колода" class="pack__logo-pic">
					</span>
					<span class="pack-link pack-link--static">
						<img src="/img/svg/6.5часть.png" alt="6.5 колода" class="pack__logo-pic">
					</span>
					<span class="pack-link pack-link--static">
						<img src="/img/svg/7часть.png" alt="7 колода" class="pack__logo-pic">
					</span>
					<span class="pack-link pack-link--static">
						<img src="/img/svg/8часть.png" alt="8 колода" class="pack__logo-pic">
					</span>
					<span class="pack-link pack-link--static">
						<img src="/img/svg/9часть.png" alt="9 колода" class="pack__logo-pic">
					</span>
				</ul>
			</div>
			<div class="settings">
				<a href="/menu_settings.html" class="settings__logo-link">
					<img src="/img/svg/settings.svg" width="115" height="115" alt="Настройки" class="settings__logo-pic">
				</a>
			</div>
			<div class="back_buttom">
				<a href="javascript:history.back()" class="back__logo-link">
					<img src="/img/svg/back.svg" width="150" height="115" alt="Назад" class="back__logo-pic">
				</a>
			</div>
		</section>
	</main>
</body>
</html>
